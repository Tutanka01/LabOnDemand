# LabOnDemand frontend: serves the Vite build and proxies /api/ to FastAPI.
# Mounted by compose.yaml as /etc/nginx/conf.d/default.conf.

# Docker's embedded DNS: lets nginx re-resolve "api" when the container IP changes.
resolver 127.0.0.11 valid=10s ipv6=off;

# No upstream keepalive on purpose: measured against uvicorn on the Compose
# network, reused upstream connections stall every request by ~40 ms (delayed
# ACK), while a fresh local connection costs well under a millisecond.
upstream api_upstream {
    zone api_zone 64k;
    server api:8000 resolve;
}

# Forward "Connection: upgrade" only for WebSocket handshakes; ordinary
# requests close the upstream connection after the response.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Volume explorer uploads (default would reject anything above 1 MB with 413).
    client_max_body_size 1g;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject;

    # Security headers are set per static location (add_header is not inherited
    # by a location that declares its own). /api/ responses keep the headers set
    # by FastAPI (file streams send their own CSP). The app itself need not be
    # framed; it frames lab URLs (NoVNC) from other origins, which these
    # headers do not restrict.

    # Fingerprinted Vite output: safe to cache forever. Missing files must 404
    # (never fall back to index.html, which would be parsed as JavaScript).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Self-destructing worker that removes a service worker shipped by an older
    # version; it must never be cached.
    location = /sw.js {
        try_files /sw.js =204;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }

    # Long-lived WebSocket terminals: idle sessions must not be cut after a
    # couple of minutes.
    location /api/v1/k8s/terminal/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # Timeouts apply between two reads/writes, not to the whole transfer:
        # large uploads/downloads keep flowing; slow archive generation gets
        # five minutes before the first byte.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Stream uploads straight to the API instead of spooling up to 1 GB to
        # disk first (upload progress then reflects the real transfer).
        proxy_request_buffering off;
    }

    # SPA entry point and client-side routes: always revalidate so a new
    # deployment is picked up on the next navigation.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }
}
