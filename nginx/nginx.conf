resolver 127.0.0.11 ipv6=off;

# En-tête Connection vers l'API : « upgrade » pour une poignée de main
# WebSocket, vide sinon. Un « Connection: upgrade » fixe empêchait la
# réutilisation des connexions keepalive vers l'upstream.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream api_upstream {
    # « resolve » (nginx >= 1.27.3) suit l'IP du conteneur api ; il exige la
    # zone partagée.
    zone api_zone 64k;
    server api:8000 resolve;

    # Connexions HTTP/1.1 réutilisées vers uvicorn (évite un handshake TCP par
    # requête). Délai inférieur au keep-alive d'uvicorn (5 s) : nginx ferme la
    # connexion inactive avant qu'uvicorn ne le fasse sous ses pieds.
    keepalive 32;
    keepalive_timeout 4s;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Plafond de corps de requête (téléversement de fichiers vers l'explorateur
    # de volumes). Sans ça, nginx refuse tout au-delà de 1 Mo (413).
    client_max_body_size 1g;

    # Activer la compression gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # En-têtes transmis à l'API, hérités par chaque location qui fait un
    # proxy_pass. Attention : définir un seul proxy_set_header dans une
    # location annule tout cet héritage ; il faut alors tout redéclarer.
    proxy_http_version 1.1;
    # $http_host conserve le port public (ex. localhost:8080) pour les URL et
    # les vérifications d'origine faites par le backend.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # En dev local, éviter que Chrome garde un ancien bundle React pendant 30 jours.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Favicon placeholder (évite les 404 dans les logs)
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }

    location = /sw.js {
        try_files /sw.js =204;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Terminal web (WebSocket longue durée). Le frontend n'envoie rien tant que
    # l'utilisateur ne tape pas : sans ces délais, nginx coupait une console
    # inactive au bout de 120 s.
    location /api/v1/k8s/terminal/ {
        proxy_pass http://api_upstream;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Relayer chaque frappe et chaque sortie immédiatement
        proxy_buffering off;
    }

    # Connexion : corps JSON de quelques centaines d'octets. Plafond serré
    # (le 1g global sert aux téléversements) : un identifiant démesuré est
    # refusé (413) avant d'atteindre l'API.
    location = /api/v1/auth/login {
        client_max_body_size 16k;
        proxy_pass http://api_upstream;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Redirection des requêtes d'API vers le backend.
    # Pas de réponse OPTIONS forgée ici : le CORS est géré par FastAPI.
    location /api/ {
        # Proxy vers l'API avec résolution DNS dynamique (container IP changeante)
        proxy_pass http://api_upstream;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;

        # Retry automatique sur erreurs temporaires (démarrage backend)
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 15s;
    }

    # Pour les requêtes racine de l'API
    location = /api/v1/status {
        proxy_pass http://api_upstream;
    }

    # Servir les fichiers HTML
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Traitement des erreurs
    error_page 404 /index.html;
    # Conserver le code 502 quand on sert la page 50x
    error_page 500 502 503 504 =502 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
